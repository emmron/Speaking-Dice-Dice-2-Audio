name: Build Android AAB

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Debug build (always runs — no signing needed) ─────────────────────
      - name: Build Debug AAB
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: race-strategy-manager-debug
          path: app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      # ── Signed Release build ───────────────────────────────────────────────
      # To enable this, add 4 secrets in your GitHub repo:
      #   Settings → Secrets and variables → Actions → New repository secret
      #
      #   KEYSTORE_BASE64      Generate your keystore first:
      #                          keytool -genkey -v -keystore racestrategy.jks \
      #                            -alias racestrategy -keyalg RSA -keysize 2048 -validity 10000
      #                        Then encode it:
      #                          base64 -w 0 racestrategy.jks   (Linux)
      #                          base64 racestrategy.jks        (Mac)
      #                        Paste the output as the secret value.
      #
      #   KEY_STORE_PASSWORD   Your keystore password
      #   KEY_ALIAS            Your key alias (e.g. racestrategy)
      #   KEY_PASSWORD         Your key password
      # ───────────────────────────────────────────────────────────────────────

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Create keystore.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat > keystore.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Signed Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Signed Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: race-strategy-manager-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
